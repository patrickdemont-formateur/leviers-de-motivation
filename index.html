<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Leviers de motivation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3b7a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2315a39a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <header class="site-header">
    <div class="container header-inner">
      <p class="brand">Leviers de motivation</p>
      <p class="badge" id="participant-badge" hidden></p>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <noscript>
      <div class="noscript">
        JavaScript est désactivé dans votre navigateur. Cette application en a besoin pour fonctionner :
        activez JavaScript, puis actualisez la page.
      </div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div id="footer-actions"></div>
      <p>Aucune donnée n’est envoyée vers un serveur : votre progression et vos notes restent uniquement sur cet appareil.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Confirmation</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-secondary" value="cancel" autofocus>Annuler</button>
        <button type="submit" class="btn btn-primary" value="ok" id="confirm-ok">Confirmer</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
